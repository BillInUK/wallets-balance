# 记录所有部署的SplitWalletLogic合约实例
type SplitWalletInstance @entity(immutable: true) {
  id: ID! # 合约地址（主键）
  serviceType: Int! # 来自Deployed事件的SERVICE_TYPE
  subServiceType: Int! # SUB_SERVICE_TYPE
  majorVersion: Int! # MAJOR_VERSION
  minorVersion: Int! # MINOR_VERSION
  deployedAt: BigInt! # 部署区块时间戳
  deployedBy: String! # 部署者（SingletonFactory地址）
}


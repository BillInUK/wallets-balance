# 存储由SplitWallet创建的收款钱包信息
type ReceiptWallet @entity(immutable: false){
  id: ID! # 钱包地址（主键）
  createdBy: Bytes! # 对应的SplitWallet合约地址
  createdAt: BigInt! # 创建时间（区块时间戳）
  erc20Balances: [ERC20Balance!]! @derivedFrom(field: "wallet") # 关联的所有ERC20余额
}

# 存储ERC20代币基本信息
type ERC20Token @entity (immutable: true){
  id: ID! # 代币合约地址（主键）
  name: String # 代币名称（可选）
  symbol: String # 代币符号（可选）
  decimals: Int # 代币小数位（可选）
  balances: [ERC20Balance!]! @derivedFrom(field: "token") # 关联的所有余额记录
}

# 存储某钱包在某代币中的余额
type ERC20Balance @entity (immutable: false){
  id: ID! # 主键：钱包地址 + "-" + 代币地址（例如："0x...-0x..."）
  wallet: ReceiptWallet! # 关联的收款钱包
  token: ERC20Token! # 关联的ERC20代币
  balance: BigInt! # 余额（初始为0，随转账事件更新）
}

# 存储由SplitWallet创建的收款钱包信息
type ReceiptWallet @entity(immutable: false){
  id: ID! # 对应string类型（钱包地址）
  createdBy: String! # SplitWallet合约地址（string）
  createdAt: BigInt! # 区块时间戳（BigInt）
  erc20Balances: [ERC20Balance!]! @derivedFrom(field: "wallet")
}

# 存储ERC20代币基本信息
type ERC20Token @entity(immutable: false) { # 改为false
  id: ID! # 代币合约地址（主键）
  name: String # 代币名称（可选）
  symbol: String # 代币符号（可选）
  decimals: Int # 代币小数位（可选）
  balances: [ERC20Balance!]! @derivedFrom(field: "token")
}

# 存储某钱包在某代币中的余额
type ERC20Balance @entity (immutable: false){
  id: ID! # 主键：钱包地址 + "-" + 代币地址（例如："0x...-0x..."）
  wallet: ReceiptWallet! # 关联的收款钱包
  token: ERC20Token! # 关联的ERC20代币
  balance: BigInt! # 余额（初始为0，随转账事件更新）
}

type TokenTotal @entity(immutable: false) {
  id: ID! # 代币合约地址
  token: ERC20Token!
  totalBalance: BigInt! # 所有钱包的该代币总余额
